<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The brand mark from `.brand .logo`, inlined as a data URI rather than
      shipped as a file: without a declared icon the browser requests
      /favicon.ico on every load and the dev console carries a 404 that looks
      like an application error. A data URI also survives the Flask-served
      production build, where /favicon.ico would need its own route.

      It redraws App.vue's mark — an accent-gradient rounded square holding a
      rotated square knocked out to --bg with a white ring. The colours are the
      literal token values (--accent #6a8cff, --accent-2 #a58bff, --bg #080a0f)
      because an SVG in a data URI cannot read CSS custom properties; the
      accent shuffle in useAccentTheme deliberately does not repaint this.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236a8cff'/%3E%3Cstop offset='1' stop-color='%23a58bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Crect x='11.5' y='11.5' width='9' height='9' rx='2' fill='%23080a0f' stroke='%23ffffff' stroke-width='2' transform='rotate(45 16 16)'/%3E%3C/svg%3E"
    />
    <title>Scriptase</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
