<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>STS DevTools</title>
  <style>
    :root {
      --bg: #0f0f14;
      --bg-surface: #16161e;
      --bg-hover: #1e1e28;
      --border: rgba(100, 100, 120, 0.2);
      --text: #c8c8d0;
      --text-dim: #666;
      --accent: #60a5fa;
      --green: #4caf50;
      --orange: #ff9800;
      --red: #f44336;
      --radius: 6px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      max-height: 560px;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
      font-size: 11px;
      line-height: 1.4;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
    }
    .header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.5px; }
    .status-dots { display: flex; gap: 6px; align-items: center; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
    .dot.ok { background: var(--green); }
    .dot.warn { background: var(--orange); }
    .dot.err { background: var(--red); }
    .dot-label { color: var(--text-dim); font-size: 10px; }

    /* Sections */
    .section { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .section-header .section-title { margin-bottom: 0; }

    /* Prompt panel */
    .mini-btn {
      padding: 4px 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-dim);
      cursor: pointer;
      font-family: inherit;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      transition: all 0.15s;
    }
    .mini-btn:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--accent); color: var(--accent); }
    .mini-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .prompt-box {
      margin: 0;
      padding: 8px;
      max-height: 124px;
      overflow-y: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 10px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
    }
    .prompt-box.empty { color: var(--text-dim); }
    #prompt-section {
      scroll-margin-top: 0;
      transition: background 0.18s, border-left-color 0.18s, box-shadow 0.18s;
    }
    #prompt-section.active-current {
      background: linear-gradient(90deg, rgba(96, 165, 250, 0.14), rgba(96, 165, 250, 0.04));
      border-left: 3px solid var(--accent);
      box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.16);
    }
    #prompt-section.active-current .section-title { color: var(--accent); }
    #prompt-section.active-current .prompt-box {
      border-color: rgba(96, 165, 250, 0.45);
      background: rgba(96, 165, 250, 0.08);
      color: #eef6ff;
    }
    #prompt-section.active-current .mini-btn {
      border-color: rgba(96, 165, 250, 0.4);
      color: var(--accent);
    }

    /* Nav grid */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 2px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 9px;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--accent); }
    .nav-btn .icon { font-size: 14px; }

    /* Test buttons */
    .test-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .test-btn {
      padding: 5px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      text-align: center;
      transition: all 0.15s;
    }
    .test-btn:hover { background: var(--bg-hover); border-color: var(--accent); }
    .test-btn.pass { border-color: var(--green); color: var(--green); }
    .test-btn.fail { border-color: var(--red); color: var(--red); }
    .test-btn.running { border-color: var(--orange); color: var(--orange); }

    /* Action bar */
    .action-bar { display: flex; gap: 4px; flex-wrap: wrap; }
    .action-btn {
      flex: 1;
      min-width: 70px;
      padding: 6px 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      text-align: center;
      transition: all 0.15s;
    }
    .action-btn:hover { background: var(--bg-hover); border-color: var(--accent); }
    .action-btn.primary { border-color: var(--accent); color: var(--accent); }
    .action-btn.danger { border-color: var(--red); color: var(--red); }

    /* Results panel */
    #results {
      padding: 8px 12px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 10px;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
      user-select: text;
    }
    #results.visible { display: block; }
    .result-pass { color: var(--green); }
    .result-fail { color: var(--red); }
    .result-info { color: var(--text-dim); }

    /* Page state */
    .page-state {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 4px 0;
    }
    .page-state .route { color: var(--accent); font-weight: 600; }
    .page-state .meta { color: var(--text-dim); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100,100,120,0.3); border-radius: 2px; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>STS DevTools</h1>
    <div class="status-dots">
      <span class="dot-label">STS</span>
      <div class="dot" id="dot-sts"></div>
      <span class="dot-label">AWA</span>
      <div class="dot" id="dot-awa"></div>
    </div>
  </div>

  <!-- Page State -->
  <div class="section" id="page-state-section">
    <div class="page-state">
      <span class="route" id="current-route">—</span>
      <span class="meta" id="page-meta"></span>
    </div>
  </div>

  <!-- Current Prompt -->
  <div class="section" id="prompt-section">
    <div class="section-header">
      <div class="section-title">Current Prompt</div>
      <button class="mini-btn" id="btn-copy-prompt" type="button" disabled>Copy</button>
    </div>
    <pre class="prompt-box empty" id="prompt-text">No prompt detected on this page.</pre>
  </div>

  <!-- Navigation -->
  <div class="section">
    <div class="section-title">Navigate</div>
    <div class="nav-grid">
      <button class="nav-btn" data-page="pipeline"><span class="icon">🚀</span>Pipeline</button>
      <button class="nav-btn" data-page="tts"><span class="icon">🎤</span>TTS</button>
      <button class="nav-btn" data-page="alignment"><span class="icon">⏱</span>Align</button>
      <button class="nav-btn" data-page="segmenter"><span class="icon">✂</span>Segment</button>
      <button class="nav-btn" data-page="scenes"><span class="icon">🎬</span>Scenes</button>
      <button class="nav-btn" data-page="storyboard"><span class="icon">🖼</span>Storyboard</button>
      <button class="nav-btn" data-page="assets"><span class="icon">🎥</span>Animator</button>
      <button class="nav-btn" data-page="editor"><span class="icon">🎛</span>Editor</button>
      <button class="nav-btn" data-page="export"><span class="icon">📦</span>Export</button>
      <button class="nav-btn" data-page="settings"><span class="icon">⚙</span>Settings</button>
    </div>
  </div>

  <!-- Module Tests -->
  <div class="section">
    <div class="section-title">Test Modules</div>
    <div class="test-grid">
      <button class="test-btn" data-test="health">Health</button>
      <button class="test-btn" data-test="tts">TTS</button>
      <button class="test-btn" data-test="scenes">Scenes</button>
      <button class="test-btn" data-test="storyboard">Storyboard</button>
      <button class="test-btn" data-test="pipeline">Pipeline</button>
      <button class="test-btn" data-test="niches">Niches</button>
      <button class="test-btn" data-test="music">Music</button>
      <button class="test-btn" data-test="story">Story</button>
    </div>
  </div>

  <!-- Actions -->
  <div class="section">
    <div class="section-title">Actions</div>
    <div class="action-bar">
      <button class="action-btn primary" id="btn-screenshot">📷 Screenshot</button>
      <button class="action-btn" id="btn-page-state">📋 Page State</button>
      <button class="action-btn" id="btn-interactive">🔍 Elements</button>
      <button class="action-btn" id="btn-projects">📂 Projects</button>
      <button class="action-btn" id="btn-jobs">📊 Jobs</button>
      <button class="action-btn" id="btn-test-all">🧪 Test All</button>
    </div>
  </div>

  <!-- Results -->
  <div id="results"></div>

  <script src="popup.js"></script>
</body>
</html>
