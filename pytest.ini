[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers -ra
markers =
    live: hits a real provider or network service. Skipped unless STS_LIVE=1.
    slow: long-running; excluded from the fast inner loop.
filterwarnings =
    error::DeprecationWarning:scriptase.*
